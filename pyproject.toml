[project]
name = "jevbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cohere>=7.2.0",
    "faiss-cpu>=1.15.1",
    "flashrank>=0.2.10",
    "numpy>=2.5.3",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "typesafe-sdk>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
plots = [
    "matplotlib>=3.11.2",
]
