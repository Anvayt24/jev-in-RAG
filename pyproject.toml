[project]
name = "jevbench"
version = "0.1.0"
description = "Benchmark of Jev, a typed decision model, against conventional rerankers in a RAG pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "anvatrive" }]
requires-python = ">=3.12"
dependencies = [
    "cohere>=7.2.0",
    "faiss-cpu>=1.15.1",
    "flashrank>=0.2.10",
    "numpy>=2.5.3",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "typesafe-sdk>=0.7.2",
]

[project.urls]
Repository = "https://github.com/Anvayt24/jev"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
plots = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["jevbench"]
