[project]
name = "jevbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cohere>=7.2.0",
    "faiss-cpu>=1.15.1",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymupdf4llm>=1.28.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "typesafe-sdk>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
